<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="sphereGrad" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- куб: изометрическая проекция -->
  <g stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <!-- задняя грань (пунктиром) -->
    <polygon points="120,80 280,80 320,120 160,120" stroke-dasharray="6,4" fill="#e0f2fe" opacity="0.3"/>
    <!-- передняя грань -->
    <polygon points="80,160 240,160 240,320 80,320" fill="#f0f9ff" opacity="0.6"/>
    <!-- верхняя грань -->
    <polygon points="80,160 240,160 280,120 120,120" fill="#dbeafe" opacity="0.7"/>
    <!-- правая грань -->
    <polygon points="240,160 280,120 280,280 240,320" fill="#bfdbfe" opacity="0.55"/>
  </g>
  <!-- шар внутри -->
  <circle cx="180" cy="220" r="78" fill="url(#sphereGrad)" stroke="#0c4a6e" stroke-width="2"/>
  <!-- блик на шаре -->
  <ellipse cx="155" cy="195" rx="22" ry="14" fill="#ffffff" opacity="0.7"/>
  <!-- задние линии куба сверху шара -->
  <g stroke="#0f172a" stroke-width="2" fill="none" stroke-dasharray="5,3" opacity="0.4">
    <line x1="120" y1="120" x2="160" y2="120"/>
    <line x1="160" y1="120" x2="160" y2="160"/>
  </g>
  <!-- подпись -->
  <text x="200" y="370" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Шар, вписанный в куб</text>
</svg>
